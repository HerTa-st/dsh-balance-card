# dsh-balance-card —— 把「余额与用量」这张浮层卡片装进 DSH。
#
# 用法：`dsh plugin --profile <name> add <本仓库路径>` 会把这个包同时写进 profile 的
# dependencies 与 dsh.profile.bundles，而包自带的这份 patch 会自动应用 —— 所以
# **这一行 `id: balance-card` 已经在了**，不要再往 profile 里 insert 第二条同名条目：
# 重复的 loader 条目 id 会让 profile 直接启动失败。
#
# 允许的写法只有一种：在 profile 自己的 cordis.patch.yml 顶层写一条**同 id 的
# 覆盖式条目**（不是 `insert:`），它按 id 合并进本行、只改 config：
#
#   - id: balance-card
#     name: dsh-balance-card
#     config:
#       mockBalance: true
#
# 设置的真相就在这一行的 config 里，命名空间 = 条目 id `balance-card`。
- insert:
    - id: balance-card
      name: dsh-balance-card
